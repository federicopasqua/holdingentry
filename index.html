<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ATPL Holding &amp; Radial Trainer</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
    <div id="app">

        <div id="settings">
            <select id="mode" aria-label="Exercise">
                <option value="holding">Holding entry</option>
                <option value="intercept">Radial intercept</option>
            </select>
            <label id="radial-toggle"><input type="checkbox" id="show-radial" checked> Show radial</label>
            <select id="format" aria-label="Track given as">
                <option value="radial">Radial in/out</option>
                <option value="qdm">QDM / QDR</option>
                <option value="mixed">Mixed</option>
            </select>
            <label id="rmi-toggle"><input type="checkbox" id="show-rmi"> RMI</label>
        </div>

        <div id="info"></div>
        <div id="canvas-wrap"><canvas id="dg"></canvas></div>

        <div id="result"></div>

        <div id="controls">
            <button class="answer-button hold-only" onclick="answer('Direct')">Direct (D)</button>
            <button class="answer-button hold-only" onclick="answer('Parallel')">Parallel (P)</button>
            <button class="answer-button hold-only" onclick="answer('Teardrop')">Teardrop (T)</button>
            <button class="answer-button ic-only" onclick="answerIntercept(0)"></button>
            <button class="answer-button ic-only" onclick="answerIntercept(1)"></button>
            <button class="answer-button ic-only" onclick="answerIntercept(2)"></button>
            <button class="answer-button ic-only" onclick="answerIntercept(3)"></button>
            <button id="next-button" onclick="nextQuestion()">Next (Enter)</button>
        </div>

        <script src="game.js"></script>
    </div>
</body>
</html>
